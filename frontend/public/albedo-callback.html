<!DOCTYPE html>
<html>
<head>
  <title>Albedo Callback - AstroSwap</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #1a1a1a;
      color: #fff;
    }
    .message {
      text-align: center;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="message">
    <div class="spinner"></div>
    <p>Processing Albedo signature...</p>
    <p style="font-size: 14px; color: #888;">This window will close automatically.</p>
  </div>

  <script>
    (function() {
      try {
        console.log('🔔 Albedo callback page loaded');
        console.log('📍 Callback URL:', window.location.href);

        // Get all URL parameters from Albedo callback
        const params = Object.fromEntries(
          new URLSearchParams(window.location.search)
        );

        console.log('📦 Albedo parameters:', params);
        console.log('🔑 Has pubkey:', !!params.pubkey);
        console.log('📝 Has signed_envelope_xdr:', !!params.signed_envelope_xdr);
        console.log('✍️ Has signature:', !!params.signature);

        // Check if opener exists
        console.log('🪟 Opener exists:', !!window.opener);
        console.log('🚪 Opener closed:', window.opener ? window.opener.closed : 'N/A');

        // Post message back to opener window
        if (window.opener && !window.opener.closed) {
          const message = {
            type: 'ALBEDO_CALLBACK',
            source: 'albedo',
            payload: params,
            timestamp: Date.now()
          };

          console.log('📤 Posting message to opener:', message);

          window.opener.postMessage(
            message,
            window.location.origin
          );

          console.log('✅ Message posted successfully');

          // Close this popup after posting message
          setTimeout(() => {
            console.log('🔒 Closing callback window');
            window.close();
          }, 500);
        } else {
          console.error('❌ Opener window not found or closed');
          // Try to close anyway
          setTimeout(() => {
            window.close();
          }, 2000);
        }
      } catch (error) {
        console.error('❌ Error in Albedo callback:', error);
        // Try to close on error
        setTimeout(() => {
          window.close();
        }, 2000);
      }
    })();
  </script>
</body>
</html>
